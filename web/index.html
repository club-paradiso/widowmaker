<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>WIDOWMAKER — 바람핀 남편에게 전부 털어놓게 하기</title>
<meta name="description" content="천장 고리에 손목이 묶인 남편. 들킨 건 한 명, 그는 그게 전부라고 한다. 아침이 오기 전에 전부 들어라. 브라우저 3D 심문 게임.">
<meta property="og:type" content="website">
<meta property="og:title" content="WIDOWMAKER — 바람핀 남편에게 전부 털어놓게 하기">
<meta property="og:description" content="들킨 건 한 명. 그는 그게 전부라고 한다. 브라우저 3D 심문 게임(한국어·English).">
<meta property="og:image" content="https://club-paradiso.github.io/widowmaker/assets/og.png">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#0b0a09">
<link rel="icon" href="./assets/favicon-48.png" type="image/png" sizes="48x48">
<link rel="apple-touch-icon" href="./assets/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;700;900&family=Newsreader:opsz,wght@6..72,500;6..72,700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  /* 방향: 부엌 식탁 위의 진술서. 종이(밝은 미색)와 밤의 방(어두운 갈색), 강조는 검붉은 색 하나.
     제목·자막은 명조(한글 Noto Serif KR / 영문 Newsreader), 손에 닿는 글자는 Pretendard, 시각·숫자는 IBM Plex Mono.
     간격은 4px 단위. 둥근 모서리 2px, 흐림(blur)·유리 효과·그림자 장식 없음. */
  :root {
    --night: #12100e; --night2: #1b1815; --rule: #3a332d; --rule2: #57493f;
    --ink-l: #ece5da; --ink-l2: #b9ad9f;            /* 어두운 바탕 위 글자 */
    --paper: #ece6db; --paper2: #e2dacd; --ink: #1d1915; --ink2: #5e554b; /* 종이와 그 위 글자 */
    --red: #9e2b25; --red-l: #d9655b;              /* 강조 하나(어두운 바탕에선 밝은 쪽) */
    --serif: "Noto Serif KR", "AppleMyungjo", serif;
    --sans: "Pretendard Variable", Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, monospace;
    --u: 4px;
  }
  html[lang="en"] { --serif: "Newsreader", Georgia, serif; }
  html, body { margin: 0; height: 100%; background: var(--night); color: var(--ink-l); font-family: var(--sans); overflow: hidden; -webkit-font-smoothing: antialiased; overscroll-behavior: none; }
  html[lang="ko"] body { word-break: keep-all; overflow-wrap: break-word; }
  canvas { display: block; }
  button, input { font: inherit; color: inherit; }
  button { cursor: pointer; touch-action: manipulation; background: none; border: 0; padding: 0; }
  :focus-visible { outline: 2px solid var(--red-l); outline-offset: 2px; }
  #vignette { position: fixed; inset: 0; pointer-events: none; background: radial-gradient(ellipse at 50% 40%, transparent 55%, rgba(0, 0, 0, 0.55) 100%); }

  /* 왼쪽 위: 시각과 상태. 판 없이 글자만 */
  #hud { position: fixed; top: calc(var(--u) * 4); left: calc(var(--u) * 5); pointer-events: none; text-shadow: 0 1px 6px rgba(0, 0, 0, 0.85); }
  #day { display: block; font-size: 13px; color: var(--ink-l2); }
  #clock { font-family: var(--mono); font-size: 36px; line-height: 1.1; font-variant-numeric: tabular-nums; }
  .meters { display: grid; grid-template-columns: auto auto; gap: 2px 12px; margin-top: calc(var(--u) * 3); font-size: 14px; }
  .lab { color: var(--ink-l2); white-space: nowrap; }
  .state { white-space: nowrap; }
  .state.worse { color: #e3b562; }
  .state.bad { color: var(--red-l); }
  #tags { grid-column: 1 / -1; margin-top: var(--u); font-size: 13px; color: var(--ink-l2); }
  #tags span + span::before { content: " · "; }
  #tags span.rec { color: var(--red-l); }

  /* 오른쪽 위: 메모 쪽지(종이) */
  #notes { position: fixed; top: calc(var(--u) * 4); right: calc(var(--u) * 5); width: 264px; max-height: calc(100% - 340px); overflow: auto; background: var(--paper); color: var(--ink); border-radius: 2px; padding: calc(var(--u) * 3) calc(var(--u) * 4) var(--u); font-size: 13.5px; line-height: 1.5; }
  #notes h3 { margin: 0 0 calc(var(--u) * 2); font-family: var(--serif); font-size: 15px; font-weight: 700; display: flex; justify-content: space-between; border-bottom: 1px solid var(--ink); padding-bottom: var(--u); }
  #notes h3 i { font-style: normal; font-family: var(--mono); font-size: 13px; }
  #notes ul { margin: 0 0 calc(var(--u) * 4); padding: 0; list-style: none; }
  #notes li { padding: calc(var(--u) * 2) 0; border-bottom: 1px dashed #b6aa9a; }
  #notes li:last-child { border-bottom: 0; }
  #notes li small { display: block; color: var(--ink2); font-size: 12.5px; }
  #notes li.struck { color: var(--ink2); }
  em.str { font-style: normal; font-size: 12px; margin-left: 6px; color: var(--ink2); }
  em.str.s3 { color: var(--red); font-weight: 600; }
  .used { color: var(--ink2); }

  /* 자막: 말한 사람 이름을 앞에 붙인 한 줄 */
  #sub { position: fixed; left: 50%; bottom: var(--subBottom, 200px); transform: translateX(-50%); width: min(780px, calc(100% - 32px)); text-align: center; font-family: var(--serif); font-size: 22px; line-height: 1.6; text-shadow: 0 1px 2px #000, 0 0 10px rgba(0, 0, 0, 0.9); pointer-events: none; }
  #sub b { font-weight: 500; color: var(--red-l); margin-right: 0.5em; font-size: 0.8em; }
  #sub.w b { color: var(--ink-l2); }
  #sub.n { color: var(--ink-l2); font-style: italic; }

  /* 행동: 세 묶음을 나란히 둔 목록(데스크톱) / 탭 하나씩(좁은 화면) */
  #acts { position: fixed; left: 0; right: 0; bottom: 0; background: var(--night); border-top: 1px solid var(--rule); padding: calc(var(--u) * 3) calc(var(--u) * 5) max(calc(var(--u) * 3), env(safe-area-inset-bottom)); display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 2fr) minmax(0, 1fr) auto; gap: 0 calc(var(--u) * 7); }
  #acts .col h4 { margin: 0 0 var(--u); font-size: 13px; font-weight: 600; color: var(--ink-l2); }
  #acts .col .list { display: grid; grid-template-columns: minmax(0, 1fr); gap: 0 calc(var(--u) * 4); }
  #acts .col.press .list { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  #acts .col button { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; text-align: left; padding: 5px 0; border-bottom: 1px solid var(--rule); font-size: 14px; color: var(--ink-l); }
  #acts .col button span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #acts .col button small { font-family: var(--mono); font-size: 11.5px; color: var(--ink-l2); flex: none; }
  #acts .col button:hover { color: #fff; border-bottom-color: var(--ink-l2); }
  #acts .col.press button { }
  #acts .verdictWrap { align-self: end; }
  #acts button.verdict { padding: 10px 18px; background: var(--red); color: #fff; border-radius: 2px; font-weight: 600; font-size: 14px; white-space: nowrap; }
  #acts button.verdict:hover { background: #b2332c; }
  #acts .tabs { display: none; }
  body.busy #acts { pointer-events: none; opacity: .45; }
  body.cine #acts, body.cine #notes, body.cine #hud { display: none; }

  #flash { position: fixed; inset: 0; background: #fff; opacity: 0; pointer-events: none; }
  #endcard { position: fixed; inset: 0; background: #000 center / cover no-repeat; opacity: 0; transition: opacity 1.4s ease; pointer-events: none; }
  #endcard::after { content: ''; position: absolute; inset: 0; background: linear-gradient(to top, rgba(0, 0, 0, 0.78) 0, rgba(0, 0, 0, 0.2) 38%, transparent 60%); }
  #endcard.on { opacity: 1; }
  @media (prefers-reduced-motion: reduce) { #endcard { transition: none; } }
  #fade { position: fixed; inset: 0; background: #000; opacity: 0; pointer-events: none; display: grid; place-items: center; font-family: var(--serif); font-size: 24px; color: var(--ink-l); text-align: center; padding: 0 24px; transition: opacity .8s; }
  #skip { position: fixed; right: 20px; bottom: 20px; display: none; font-size: 14px; color: var(--ink-l2); border-bottom: 1px solid var(--ink-l2); z-index: 5; }
  body.cine #skip { display: block; }
  body.cine #sub { bottom: 72px; }

  /* 종이 카드(고르기·아침·판결·결과) */
  .modal { position: fixed; inset: 0; display: none; place-items: center; background: rgba(8, 7, 6, 0.72); z-index: 3; }
  .modal.on { display: grid; }
  .card { position: relative; background: var(--paper); color: var(--ink); border-radius: 2px; padding: calc(var(--u) * 7) calc(var(--u) * 7) calc(var(--u) * 6); width: min(560px, calc(100% - 24px)); max-height: calc(100% - 32px); overflow: auto; box-sizing: border-box; }
  .card h2 { margin: 0 0 calc(var(--u) * 3); font-family: var(--serif); font-size: 26px; font-weight: 700; line-height: 1.3; }
  .card h3 { font-family: var(--serif); font-size: 16px; margin: calc(var(--u) * 6) 0 calc(var(--u) * 2); padding-bottom: var(--u); border-bottom: 1px solid var(--ink); }
  .card p { line-height: 1.75; margin: 0 0 calc(var(--u) * 3); }
  .opts { display: flex; flex-direction: column; margin-top: calc(var(--u) * 4); border-top: 1px solid var(--ink); }
  .opts > button { text-align: left; padding: calc(var(--u) * 3) 0; border-bottom: 1px solid #c4b8a8; font-size: 16px; font-weight: 600; }
  .opts > button:hover { color: var(--red); }
  .opts > button small { display: block; color: var(--ink2); font-size: 13.5px; font-weight: 400; margin-top: 2px; }
  .opts .share { display: flex; gap: calc(var(--u) * 6); padding: calc(var(--u) * 3) 0; border-bottom: 1px solid #c4b8a8; }
  .opts .share button { font-size: 14px; color: var(--ink2); text-decoration: underline; text-underline-offset: 3px; }
  #resultCard .rank { float: right; margin: 0 0 8px 16px; font-family: var(--serif); font-size: 64px; font-weight: 900; line-height: 1; color: var(--red); }
  #resultCard .rank small { display: block; font-family: var(--sans); font-size: 12px; font-weight: 500; color: var(--ink2); text-align: right; }
  #resultCard .story { font-family: var(--serif); font-size: 17px; }
  #resultCard ul { margin: 0; padding: 0; list-style: none; }
  #resultCard li { padding: calc(var(--u) * 2) 0; border-bottom: 1px dashed #b6aa9a; font-size: 15px; line-height: 1.5; }
  #resultCard li em { font-style: normal; font-size: 13px; margin-left: 6px; }
  #resultCard li.hid em { color: var(--red); font-weight: 600; }
  #resultCard li.got em { color: var(--ink2); }
  #resultCard li small { color: var(--ink2); }
  #resultCard dl { display: grid; grid-template-columns: auto 1fr; gap: 6px 16px; font-size: 14.5px; margin: 0; }
  #resultCard dt { color: var(--ink2); } #resultCard dd { margin: 0; }
  #resultCard .praise { font-family: var(--serif); font-weight: 700; }
  #resultCard .fiction { font-size: 12.5px; color: var(--ink2); margin: calc(var(--u) * 4) 0 0; }

  /* 폰 화면 */
  #phoneui { position: fixed; right: 50%; top: 50%; transform: translate(50%, -50%); width: min(340px, 92vw); max-height: min(620px, 86vh); overflow: auto; background: #f4f3f0; color: #1b1b1b; border-radius: 28px; border: 9px solid #0d0d0d; padding: 12px; display: none; font-size: 14px; z-index: 2; box-sizing: border-box; }
  #phoneui.on { display: block; }
  #phoneui.note { top: auto; bottom: 240px; right: 16%; transform: none; width: 256px; }
  #phoneui .bar { display: flex; align-items: center; justify-content: space-between; font-size: 12px; color: #555; margin-bottom: 8px; min-height: 20px; }
  #phoneui .bar button { color: #333; font-size: 13px; padding: 2px 4px; }
  #phoneui:has(.home) { background: linear-gradient(rgba(0, 0, 0, 0.18), rgba(0, 0, 0, 0.42)), #3a3340 url("./assets/lock.webp") center / cover; }
  #phoneui:has(.home) .bar { color: #f2eee8; }
  #phoneui:has(.home) .home button { color: #fff; text-shadow: 0 1px 2px rgba(0, 0, 0, 0.6); }
  #phoneui:has(.home) .home button i { background: rgba(244, 241, 236, 0.92); }
  #phoneui .home { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px 6px; margin: 12px 0 16px; }
  #phoneui .home button { display: grid; justify-items: center; gap: 5px; font-size: 11.5px; color: #1b1b1b; }
  #phoneui .home button i { font-style: normal; width: 50px; height: 50px; border-radius: 13px; display: grid; place-items: center; font-size: 24px; background: #e2e0db; }
  #phoneui .home button.opened i { box-shadow: inset 0 0 0 2px var(--red); }
  #phoneui .rows { background: #fff; border-radius: 12px; overflow: hidden; }
  #phoneui .rows button { display: block; width: 100%; text-align: left; border-bottom: 1px solid #e8e6e1; padding: 10px 12px; color: #1b1b1b; font-size: 13.5px; }
  #phoneui .rows button:last-child { border-bottom: 0; }
  #phoneui .rows button small { display: block; color: #666; font-size: 12px; margin-top: 2px; }
  #phoneui .rows button.took { color: #888; }
  #phoneui .rows button.hasimg { display: grid; grid-template-columns: 52px 1fr; column-gap: 10px; align-items: center; }
  #phoneui .rows button.hasimg .th { grid-row: span 2; width: 52px; height: 52px; object-fit: cover; border-radius: 6px; background: #ddd; }
  #phoneui .rows button.hasimg small { grid-column: 2; }
  #phoneui .detail .ph { display: block; width: 100%; border-radius: 8px; margin: 2px 0 8px; }
  #phoneui .detail { background: #fff; border-radius: 12px; padding: 12px; line-height: 1.55; min-height: 60px; }
  #phoneui .detail h4 { margin: 0 0 6px; font-size: 14.5px; }
  #phoneui .msg { background: #d9ecc9; border-radius: 14px; padding: 9px 11px; margin: 6px 0; line-height: 1.45; }
  #phoneui .act { display: flex; gap: 8px; margin-top: 10px; }
  #phoneui .act button, #phoneui .ret { flex: 1; padding: 10px 8px; border-radius: 10px; border: 1px solid #c8c5bf; background: #fff; color: #1b1b1b; font-size: 13.5px; }
  #phoneui .act button.take { background: var(--red); border-color: var(--red); color: #fff; }
  #phoneui .act button:disabled { opacity: .55; }
  #phoneui .ret { display: block; width: 100%; margin-top: 12px; }

  /* 시작 화면: 진술서 한 장 */
  #start { background: rgba(8, 7, 6, 0.6); overflow: auto; }
  #start .card { width: min(640px, calc(100% - 24px)); padding: calc(var(--u) * 8) calc(var(--u) * 9) calc(var(--u) * 7); }
  .sheetHead { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; border-bottom: 2px solid var(--ink); padding-bottom: calc(var(--u) * 2); margin-bottom: calc(var(--u) * 6); font-size: 13px; color: var(--ink2); }
  .switch { display: flex; gap: calc(var(--u) * 3); }
  .switch button { font-size: 13px; color: var(--ink2); padding: 2px 0; }
  .switch button.on { color: var(--ink); font-weight: 700; box-shadow: inset 0 -2px 0 var(--red); }
  #start h1 { font-family: var(--serif); font-size: clamp(30px, 5.4vw, 46px); font-weight: 900; line-height: 1.25; margin: 0 0 calc(var(--u) * 2); }
  html[lang="en"] #start h1 { font-size: clamp(28px, 4.4vw, 40px); }
  #start .h1sub { font-family: var(--serif); font-size: 18px; color: var(--ink2); margin: 0 0 calc(var(--u) * 6); }
  #lead { font-family: var(--serif); font-size: 17px; line-height: 1.85; margin: 0 0 calc(var(--u) * 6); }
  #start ol { margin: 0 0 calc(var(--u) * 7); padding: 0 0 0 1.4em; font-size: 14.5px; line-height: 1.7; color: var(--ink); }
  #start ol li { margin-bottom: calc(var(--u) * 2); padding-left: 4px; }
  #start ol li b { font-weight: 700; }
  .fields { display: grid; grid-template-columns: auto 1fr; gap: calc(var(--u) * 3) calc(var(--u) * 5); align-items: center; margin-bottom: calc(var(--u) * 7); font-size: 14.5px; }
  .fields label { color: var(--ink2); }
  .fields input[type=text] { border: 0; border-bottom: 1px solid var(--ink); background: transparent; padding: 4px 2px; font-family: var(--serif); font-size: 18px; width: 12em; max-width: 100%; border-radius: 0; }
  .fields input[type=text]::placeholder { color: #8a7f72; font-size: 14px; }
  .ageRow { display: flex; align-items: center; gap: 12px; }
  .ageRow output { font-family: var(--mono); font-size: 16px; min-width: 3.2em; }
  .fields input[type=range] { width: min(240px, 50vw); accent-color: var(--red); }
  .gfx { display: inline-flex; gap: 0; font-size: 13px; }
  .gfx button { padding: 4px 10px; border: 1px solid currentColor; color: var(--ink-l2); opacity: 0.75; }
  .gfx button + button { border-left: 0; }
  .gfx button[aria-pressed="true"] { background: var(--red); border-color: var(--red); color: #fff; opacity: 1; }
  .vols { display: flex; flex-wrap: wrap; gap: 8px 18px; font-size: 13.5px; color: var(--ink2); }
  .vols label { display: inline-flex; align-items: center; gap: 6px; }
  .vols input[type=range] { width: 84px; }
  .go { display: flex; align-items: center; gap: calc(var(--u) * 5); flex-wrap: wrap; }
  #go { padding: 14px 32px; background: var(--red); color: #fff; border-radius: 2px; font-size: 17px; font-weight: 700; }
  #go:hover:not(:disabled) { background: #b2332c; }
  #go:disabled { opacity: .55; cursor: default; }
  #resume { font-size: 15px; color: var(--ink); text-decoration: underline; text-underline-offset: 3px; }
  #resume[hidden] { display: none; }
  #start .fiction { font-size: 12.5px; color: var(--ink2); margin: calc(var(--u) * 7) 0 0; border-top: 1px solid #c4b8a8; padding-top: calc(var(--u) * 3); }

  @media (max-width: 860px), (max-height: 560px) {
    #hud { top: 10px; left: 12px; }
    #clock { font-size: 30px; }
    .meters { font-size: 12.5px; gap: 1px 8px; margin-top: 6px; }
    .state { white-space: normal; max-width: 120px; }
    #notes { top: 10px; right: 10px; width: auto; max-width: 46%; padding: 8px 12px 2px; font-size: 12.5px; cursor: pointer; }
    #notes:not(.open) ul { display: none; }
    #notes:not(.open) h3 { margin-bottom: 6px; }
    #sub { font-size: 17px; }
    #acts { grid-template-columns: 1fr; padding: 8px 12px max(10px, env(safe-area-inset-bottom)); gap: 6px; }
    #acts .tabs { display: flex; align-items: center; gap: 18px; border-bottom: 1px solid var(--rule); padding-bottom: 6px; }
    #acts .tabs button { font-size: 14px; color: var(--ink-l2); padding: 4px 0; }
    #acts .tabs button.on { color: var(--ink-l); box-shadow: inset 0 -2px 0 var(--red-l); }
    #acts .tabs button.verdict { margin-left: auto; padding: 6px 14px; color: #fff; box-shadow: none; }
    #acts .col { display: none; } #acts .col.on { display: block; } #acts .col h4, #acts .verdictWrap { display: none; }
    #acts .col .list, #acts .col.press .list { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 14px; }
    #acts .col button { font-size: 13.5px; padding: 7px 0; }
    #phoneui.note { right: 50%; transform: translateX(50%); bottom: calc(var(--subBottom, 200px) + 84px); }
    #start .card { padding-left: 22px; padding-right: 22px; }
    .card { padding: 26px 20px 22px; }
  }
  /* ===== 시작 화면 v3: 키아트(사진) 한 장을 화면 가득, 왼쪽에 큰 제목과 짧은 양식. 카드 상자 없음 ===== */
  #start { background: #0b0908 url("./assets/keyart.webp") center / cover no-repeat; overflow: auto; place-items: stretch; }
  #start::before { content: ""; position: fixed; inset: 0; background: linear-gradient(90deg, rgba(10, 8, 7, 0.93) 0%, rgba(10, 8, 7, 0.8) 34%, rgba(10, 8, 7, 0.15) 62%, rgba(10, 8, 7, 0) 100%); pointer-events: none; }
  #start .card { position: relative; width: min(720px, 100%); max-height: none; margin: 0; padding: clamp(24px, 5vh, 56px) clamp(24px, 5vw, 72px); background: none; color: var(--ink-l); border-radius: 0; align-self: start; justify-self: start; }
  #start .sheetHead { border-bottom: 1px solid var(--rule2); color: var(--ink-l2); margin-bottom: clamp(16px, 4vh, 36px); max-width: 560px; }
  #start #lead, #start ol, #start .fields { max-width: 560px; }
  #start #lead { margin-bottom: 18px; }
  #start ol { margin-bottom: 22px; }
