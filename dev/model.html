<!doctype html><html><head><meta charset="utf-8"><title>model check</title>
<style>html,body{margin:0;background:#222;overflow:hidden}</style>
<script type="importmap">{"imports":{"three":"../lib/three/build/three.module.js","three/addons/":"../lib/three/examples/jsm/"}}</script></head><body>
<script type="module">
// 모델 확인용(개발): ?cam=front|close|side ?expr= ?tell= ?t=초
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { loadHusband } from '../js/husband.js';
const q = new URLSearchParams(location.search);
const r = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
r.setSize(innerWidth, innerHeight); r.toneMapping = THREE.NeutralToneMapping; r.shadowMap.enabled = true;
document.body.appendChild(r.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x2a2522);
const env = new THREE.PMREMGenerator(r).fromScene(new RoomEnvironment(), 0.04).texture;
scene.add(new THREE.HemisphereLight(0xffeedd, 0x332211, 0.6));
const key = new THREE.SpotLight(0xffe2c0, 40, 0, 0.7, 0.5); key.position.set(0.6, 3.2, 1.6); key.castShadow = true; scene.add(key);
const floor = new THREE.Mesh(new THREE.PlaneGeometry(10, 10), new THREE.MeshStandardMaterial({ color: 0x554433 })); floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; scene.add(floor);
const faces = await fetch('../data/faces.json').then((x) => x.json());
const H = await loadHusband(scene, { url: '../assets/' + (q.get('m') || 'husband') + '.glb', envTex: env, faces, ageTex: '../assets/' + (q.get('m') === 'spouse_f' ? 'skin_mid_f.webp' : 'skin_mid_m.webp') });
H.setAge(+(q.get('age') || 28));
H.setClothes({ top: q.get('top') !== '0', bottom: q.get('bottom') !== '0' });
const cam = new THREE.PerspectiveCamera(q.get('cam') === 'close' ? 22 : 40, innerWidth / innerHeight, 0.05, 50);
const views = { front: [[0, 1.3, 3.2], [0, 1.25, 0]], close: [[0.05, 1.62, 0.75], [0, 1.6, 0]], side: [[2.6, 1.4, 1.2], [0, 1.3, 0]], high: [[0, 2.3, 1.4], [0, 1.9, 0]] };
H.update(1/60); const e = H.point('eyes'); views.close = [[0.05, e.y + 0.02, e.z + 0.75], [0, e.y - 0.02, e.z]];
const v = views[q.get('cam') || 'front']; cam.position.set(...v[0]); cam.lookAt(...v[1]);
if (q.get('expr')) H.setExpr(q.get('expr')); else H.setExpr('nervous');
H.setLook(cam.position, 1);
if (q.get('tension')) H.state.tension = +q.get('tension');
if (q.get('sag')) H.state.sag = +q.get('sag');
const T = +(q.get('t') || 2);
let t = 0; const dt = 1 / 60;
while (t < T) { if (q.get('tell') && t > T - 0.5 && !H.face.tell) H.tell(q.get('tell')); H.update(dt); t += dt; }
if (q.get('say')) { H.say(q.get('say'), q.get('lang') || 'ko', 2); for (let i = 0; i < 20; i++) H.update(dt); }
r.render(scene, cam);
window.__ready = true;
</script></body></html>
